plugins {
    id 'com.android.application'
}

android {
    namespace 'com.autopos.kasir'
    compileSdk 34

    defaultConfig {
        applicationId "com.autopos.kasir"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
